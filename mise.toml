[tools]
bun  = "1.3.11"
jq   = "1.8.1"
node = "24.14.1"
# Reads the PAT for biz:sync out of the OS keychain. Only that one task needs
# it, so it is not a `setup` dependency — but pinning it here keeps the tool in
# the project rather than assuming a machine-wide install.
fnox = "1.34.0"
# Standalone binary, so it belongs here rather than in package.json.
# (The Tauri CLI is an npm package — pinned in package.json alongside wrangler.)
"aqua:cloudflare/cloudflared" = "2026.8.2"

# iOS toolchain. `tauri ios init` shells out to `pod`, and previously that came
# from a global `brew install cocoapods`. Managed here instead so nothing this
# project needs lives outside mise.
#
# Ruby is not optional alongside it: the gem backend builds against whichever
# Ruby is *activated*, and with none declared it falls back to macOS's system
# Ruby 2.6, which cocoapods 1.17 cannot run on ("cannot load such file --
# random/formatter"). Declaring it here is also why `mise exec` alone was not
# enough — the gem must be installed against the managed Ruby, not merely run
# beside it.
#
# Cost, stated plainly: `mise install` now builds Ruby, which is minutes on a
# clean machine, for a toolchain only iOS work touches.
ruby = "3.4.9"

[env]
# ── Project-scoped Cloudflare state ─────────────────────────────────────────
# Wrangler defaults to global state under ~/Library/Preferences/.wrangler,
# shared by every project on the machine. That is what made the loss of the
# original worker/D1/R2 unattributable: the trail sat in 369 logs belonging to
# 40-odd other projects, under global retention that had already aged out the
# months when the deletion happened (see the ADR 006 postscript).
#
# Redirected into .wrangler/ here, so the trail is project-only, complete, and
# lives beside the code. .wrangler/ is gitignored.
WRANGLER_LOG_PATH  = "{{config_root}}/.wrangler/logs"
WRANGLER_CACHE_DIR = "{{config_root}}/.wrangler/cache"

# Pin the account so no command can act against a different one, whatever the
# ambient credential happens to be authorised for.
CLOUDFLARE_ACCOUNT_ID = "7384af54e33b8a54ff240371ea368440"

# Playwright otherwise caches browsers globally, and at a different path per OS
# (~/.cache on Linux, ~/Library/Caches on macOS) — which is why the install task
# needed an OS branch whose skip check never matched on macOS. One project-local
# path makes it uniform and self-contained.
PLAYWRIGHT_BROWSERS_PATH = "{{config_root}}/.playwright"

# CocoaPods lives in the project, not in Homebrew. GEM_HOME keeps the gems here
# and _.path puts their binaries on PATH for tasks.
#
# mise's `gem:` backend cannot do this on 2026.8.9: it builds against whichever
# Ruby is on PATH, and `mise exec ruby@X -- sh -c 'command -v ruby'` still
# resolves /usr/bin/ruby, so the install fell back to macOS Ruby 2.6 and failed
# ("ffi requires Ruby version >= 3.0"). Declaring ruby in [tools] and installing
# the gem into GEM_HOME sidesteps the backend entirely.
GEM_HOME     = "{{config_root}}/.gem"
COCOAPODS_VERSION = "1.17.0"
# mise lists ruby as current but does not place it on PATH for tasks on
# 2026.8.9 — inside a task `command -v ruby` still returns /usr/bin/ruby (2.6),
# which cocoapods cannot run on. The install dir is deterministic given the
# pinned version above, so put it on PATH explicitly.
# mise appends _.path entries AFTER /usr/bin, so they cannot shadow a system
# binary — the iOS tasks prepend RUBY_BIN themselves for exactly that reason.
RUBY_BIN = "{{env.HOME}}/.local/share/mise/installs/ruby/3.4.9/bin"
_.path   = ["{{config_root}}/.gem/bin"]

# The dev tunnel. `tunnel:named` referenced TUNNEL_NAME and TUNNEL_HOSTNAME and
# neither was ever defined, so that task expanded to an empty tunnel name and
# could not have worked. Deliberately not `remy.` — that is production.
TUNNEL_NAME     = "remy-sport-dev"
TUNNEL_HOSTNAME = "dev-remy.ubuntusoftware.net"
TUNNEL_ZONE     = "ubuntusoftware.net"

CF_WORKER_NAME  = "remy-sport"
CF_SUBDOMAIN    = "gedw99"
CF_DEPLOY_URL   = "https://remy.ubuntusoftware.net"
DEV_URL         = "http://localhost:8787"
GITHUB_REPO_URL = "https://github.com/joeblew999/remy-sport"

# The Product Owner's repo, cloned as a sibling by biz:sync. The path is not a
# free choice: scripts/domain-generate.ts resolves `../remy-sport-biz/domain/model`
# and AGENTS.md documents the same location, so a nested ./.biz/ checkout would
# mean editing both. Sibling also keeps it outside this repo's tree, so there is
# nothing to gitignore and no chance of it being committed here.
BIZ_REPO_URL = "https://github.com/joeblew999/remy-sport-biz.git"
BIZ_DIR      = "{{config_root}}/../remy-sport-biz"
BIZ_TOKEN_KEY = "GITHUB_BIZ_REPO_TOKEN"

# ── Core ────────────────────────────────────────────────────────────────────

[tasks.install]
description = "Install dependencies"
sources     = ["package.json", "bun.lock"]
run         = "bun install"

[tasks."auth:schema:generate"]
description = "Regenerate src/db/auth-schema.ts from src/auth.config.ts via the Better Auth CLI"
depends     = ["install"]
# Better Auth owns its own tables — we do not hand-write them. Adding a plugin
# or an extra user field in auth.config.ts changes the schema, so re-run this
# and then create a migration (cf:d1:migrations:create) for the delta.
#
# The CLI needs a module-level `auth` export, which src/auth.cli.ts provides;
# the runtime instance takes a Hono Context and cannot be imported here.
#
# `auth`, not `@better-auth/cli`: the CLI was renamed at 1.5 and the old package
# is frozen at 1.4.22, so it cannot read a 1.7 config. The new one ships both an
# `auth` and a `better-auth` binary; `auth` is what the upstream docs use.
run         = "bun x auth generate --config src/auth.cli.ts --output src/db/auth-schema.ts -y"

[tasks."auth:schema:check"]
description = "Fail if src/db/auth-schema.ts is stale relative to src/auth.config.ts"
depends     = ["install"]
# Guards the drift that broke sign-in: a generated file that someone edited by
# hand, or a config change nobody regenerated for.
run = """
set -e
TMP=$(mktemp -d)
bun x auth generate --config src/auth.cli.ts --output "$TMP/auth-schema.ts" -y >/dev/null 2>&1
if ! diff -q "$TMP/auth-schema.ts" src/db/auth-schema.ts >/dev/null; then
  echo "auth:schema:check: src/db/auth-schema.ts is stale — run 'mise run auth:schema:generate'" >&2
  diff "$TMP/auth-schema.ts" src/db/auth-schema.ts || true
  rm -rf "$TMP"
  exit 1
fi
rm -rf "$TMP"
echo "auth:schema:check: auth-schema.ts is up to date"
"""

# ── Companion repo ──────────────────────────────────────────────────────────

[tasks."biz:sync"]
description = "Clone or fast-forward the remy-sport-biz checkout at ../remy-sport-biz (local dev only)"
# remy-sport-biz is the Product Owner's source of truth, and it is private, so
# an unauthenticated clone cannot work — hence the PAT. It is a fine-grained
# token scoped to that one repo with Contents: Read-only, registered once by
# hand (see README, "Companion repo"); this task only reads it.
#
# Nothing in the build depends on this. src/domain/vocabularies.ts is generated
# from the biz fixtures but committed, so CI and deploy never clone anything —
# only regenerating it needs the checkout. That is why this is not wired into
# `setup` and why failing here is not a build failure.
#
# On token handling: the URL written to .git/config is the clean, token-free
# one, and credentials are supplied per-invocation through GIT_ASKPASS. The
# helper script holds no secret of its own — it echoes an environment variable
# that exists only in this task's process tree, and the temp dir is removed on
# exit. `-c credential.helper=` disables any inherited helper (osxkeychain is
# configured on this machine) so nothing gets persisted behind our back, and
# the grep afterwards asserts the invariant instead of trusting it.
run = """
set -e

BIZ_DIR="{{env.BIZ_DIR}}"
BIZ_URL="{{env.BIZ_REPO_URL}}"

if ! TOKEN=$(fnox get {{env.BIZ_TOKEN_KEY}} 2>/dev/null) || [ -z "$TOKEN" ]; then
  cat >&2 <<'EOF'
biz:sync: fnox secret {{env.BIZ_TOKEN_KEY}} is not set.

  remy-sport-biz is private, so this needs a GitHub fine-grained PAT scoped to
  joeblew999/remy-sport-biz with Contents: Read-only.

  Create one:  https://github.com/settings/personal-access-tokens/new
  Store it:    mise exec -- fnox set --global -p keychain {{env.BIZ_TOKEN_KEY}}
               (prompts with hidden input — the value never reaches argv or
                shell history)

  Not having it only blocks `domain:sync` against a newer model.
  src/domain/vocabularies.ts is committed, so builds do not need this repo.
EOF
  exit 1
fi

ASKPASS_DIR=$(mktemp -d)
trap 'rm -rf "$ASKPASS_DIR"' EXIT
cat >"$ASKPASS_DIR/git-askpass" <<'EOF'
#!/bin/sh
# No secret lives in this file — it echoes what the parent put in the env.
case "$1" in
  Username*) printf '%s' x-access-token ;;
  *)         printf '%s' "$BIZ_PAT" ;;
esac
EOF
chmod +x "$ASKPASS_DIR/git-askpass"

export GIT_ASKPASS="$ASKPASS_DIR/git-askpass"
export BIZ_PAT="$TOKEN"
export GIT_TERMINAL_PROMPT=0

# A fine-grained PAT with a short expiry is the expected setup, so "it stopped
# working" is a routine outcome rather than an odd one. Git's own message for
# that case says only "Invalid username or token", which does not point anywhere.
auth_failed() {
  cat >&2 <<'EOF'

biz:sync: git could not authenticate.

  The PAT in fnox is most likely expired — these are deliberately short-lived —
  or it is missing Contents: Read-only on joeblew999/remy-sport-biz.

  Mint a replacement and overwrite the stored one:

    mise exec -- fnox set --global -p keychain {{env.BIZ_TOKEN_KEY}}
EOF
  exit 1
}

if [ -d "$BIZ_DIR/.git" ]; then
  # Resets the URL first, so a checkout somebody cloned with an embedded token
  # is repaired rather than carried forward.
  git -C "$BIZ_DIR" remote set-url origin "$BIZ_URL"
  git -c credential.helper= -C "$BIZ_DIR" fetch --quiet origin || auth_failed
  BEHIND=$(git -C "$BIZ_DIR" rev-list --count HEAD..origin/main)
  if [ "$BEHIND" = "0" ]; then
    echo "biz:sync: already up to date at $(git -C "$BIZ_DIR" rev-parse --short HEAD)"
  else
    git -C "$BIZ_DIR" merge --ff-only origin/main
    echo "biz:sync: fast-forwarded $BEHIND commit(s) to $(git -C "$BIZ_DIR" rev-parse --short HEAD)"
  fi
else
  git -c credential.helper= clone --quiet "$BIZ_URL" "$BIZ_DIR" || auth_failed
  echo "biz:sync: cloned into $BIZ_DIR"
fi

if grep -qF -- "$TOKEN" "$BIZ_DIR/.git/config"; then
  echo "biz:sync: the token reached $BIZ_DIR/.git/config — refusing to leave it there" >&2
  exit 1
fi
"""

# Two configs because two JSX runtimes: the Worker is Hono JSX, the SPA is
# React. Neither was checking .tsx at all until now — `include` was
# `src/**/*.ts`, so every component in the repo went untypechecked and a page
# kept rendering a field that had been deleted from its type.
# UI copy is compiled, so it has to exist before anything typechecks it. The
# Vite plugin does this during a build; this task is for everything else.
[tasks."brand:icons"]
description = "Regenerate every app icon — web, desktop, iOS, Android — from src/web/public/brand.svg"
depends     = ["install"]
# One drawing, two generators, every platform.
#
# src/web/brand.svg is the only place the mark exists. Before it, the sidebar
# drew a basketball in CSS with two pseudo-elements and scaleX/scaleY, which
# renders at 32px and produces no file — so installing the app on a phone got a
# screenshot of the page as its icon, and src-tauri/icons held sixteen files
# nobody could regenerate from anything.
#
# Neither generator is hand-rolled and neither is a size list here: the sizes
# each OS wants change with its releases, and a list in this repo would be a
# snapshot of what was true when somebody last looked.
#
#   @vite-pwa/assets-generator  favicon, maskable, apple-touch, the manifest set
#   tauri icon                  .icns, .ico, the iOS AppIcon set, Android mipmaps
#
# The image and preset come from pwa-assets.config.ts, not flags: `--preset
# minimal2023` parses and then fails with "not yet implemented".
#
# Both read the SVG directly, so there is no intermediate PNG to regenerate and
# forget. Output is committed — a build must not depend on rasterising an SVG.
run = """
set -e
bun x pwa-assets-generator
bun x tauri icon src/web/public/brand.svg
"""

[tasks."i18n:validate"]
description = "Validate project.inlang/settings.json with the inlang CLI"
depends     = ["install"]
# The CLI is pinned in package.json rather than run through `bun x @inlang/cli@latest`,
# which downloaded a fresh unpinned copy on every call — the same rule that puts
# wrangler and the Tauri CLI there.
#
# `validate` checks the SETTINGS file, not the messages. That is still worth
# running: domain:sync writes project.inlang/settings.json from the model's
# locale vocabulary, so a malformed locale added upstream breaks the compiler
# with an error that points at the wrong thing.
#
# `inlang lint` would be the one that checks messages, and it is gone — v3
# removed lint rules pending https://github.com/opral/lix/issues/239. That is
# why scripts/check-messages.ts exists and is marked temporary.
run = "bun x inlang validate --project ./project.inlang"

[tasks."i18n:generate"]
description = "Compile messages/*.json into typed message functions (Paraglide). The locale list comes from project.inlang/settings.json, which domain:sync derives from the model's ALL_LOCALES."
depends     = ["install"]
run         = "bun x paraglide-js compile --project ./project.inlang --outdir ./src/paraglide"

[tasks."typecheck"]
description = "Typecheck the Worker, the SPA and the tests. Three, because they need three different tsconfigs."
depends     = ["install", "i18n:generate"]
# The third one is tests/, and it was in neither of the other two: `tsconfig.json`
# includes src/**, src/web/tsconfig.json includes src/web/**, and fifty-four test
# files were in no config at all. This task reported both halves clean while
# nothing had ever typechecked a single test.
#
# The first run found 99 errors, and one of them was the point: adding a field
# to `ApiEvent` left tests/helpers/api-fixtures.ts returning an object without
# it, while the file's own docstring promised "the next field added to the
# contract is a compile error here and nowhere else".
#
# ## Three processes, not three lines
#
# They sat in a column and ran one after another for 9.0s on a twelve-core
# machine, for three jobs that share nothing: 2.5s + 3.5s + 3.0s. In parallel it
# is the slowest of them, ~3.5s, and warm it is ~1.2s.
#
# `:::` separates tasks, which is why each project is its own task rather than a
# line here. Without it mise reads everything after the first name as arguments
# to that task and silently runs one thing.
run = "mise run typecheck:worker ::: typecheck:spa ::: typecheck:tests"

# The three projects. Each is `--incremental` by way of its tsconfig, so the
# second run of a loop costs about a third of the first. `typecheck:clean` below
# is what the gate uses.
[tasks."typecheck:worker"]
description = "Typecheck the Worker (Hono JSX)"
hide        = true
run         = "bun x tsc --noEmit -p tsconfig.json"

[tasks."typecheck:spa"]
description = "Typecheck the SPA (React JSX)"
hide        = true
run         = "bun x tsc --noEmit -p src/web/tsconfig.json"

[tasks."typecheck:tests"]
description = "Typecheck the tests"
hide        = true
run         = "bun x tsc --noEmit -p tsconfig.tests.json"

[tasks."typecheck:clean"]
description = "Typecheck from scratch, ignoring the incremental caches — what the gate runs"
depends     = ["install", "i18n:generate"]
# The gate must not be able to pass on a stale cache. TypeScript's invalidation
# is reliable in practice, but "reliable in practice" is not the standard for
# the thing that decides whether a commit is safe, and here it is free: at ~3.5s
# in parallel this sits well inside test:render's 19s, so `check` does not
# notice the difference.
run = """
mise run typecheck:worker --incremental false \
  ::: typecheck:spa --incremental false \
  ::: typecheck:tests --incremental false
"""

[tasks."domain:sync"]
description = "Copy the Product Owner's model in from remy-sport-biz — verbatim, no transform"
depends     = ["install"]
# This replaced a 900-line generator that read JSONL and emitted TypeScript. The
# model is authored as TypeScript upstream now, so there is nothing to
# transform — and every silent bug that pipeline produced was a transform
# failing quietly. What proves the copy agrees with this database is the seed:
# db.insert(city).values(CITY) does not compile if a field and a column
# disagree.
run = "bun scripts/domain-sync.ts"

[tasks."check:domain"]
description = "Fail if the committed model has drifted from remy-sport-biz"
depends     = ["install"]
# The copies are committed so a build never needs the companion repo — it is
# private, and requiring it would put a credential in every deploy.
run = "bun scripts/domain-sync.ts --check"



[tasks."deps:outdated"]
description = "Show npm packages behind their latest release"
depends     = ["install"]
run         = "bun outdated"

[tasks."deps:update"]
description = "Update npm packages within the semver ranges in package.json"
# Only moves within existing ranges — a major bump still needs the range in
# package.json edited deliberately, so this can never silently cross a breaking
# boundary. Run `mise run check` and `mise run test` afterwards.
depends     = ["install"]
run = """
set -e
bun update
mise run check
"""

[tasks.setup]
description = "Install deps, build the SPA, write .dev.vars, apply local D1 migrations, and install Playwright"
# These five are genuinely independent, so running them in parallel is correct
# here — unlike the deploy pipeline, which needs explicit ordering (ADR 006 §8).
#
# web:build belongs here, not just in cf:deploy. dist/web is gitignored and the
# [assets] binding points at it, so on a fresh clone `wrangler dev` refuses to
# start at all: "The directory specified by the assets.directory field in your
# configuration file does not exist". Everything local runs through setup —
# dev, dev:seed, dev:ensure, test — so building here fixes all of them at once.
# web:build declares sources/outputs, so it is a no-op once dist/web is current.
depends     = ["install", "web:build", "dev:vars", "cf:d1:migrations:apply", "playwright:install", "fonts:vendor", "seed:sql"]

[tasks."playwright:install"]
description = "Install the Playwright browser (idempotent)"
depends     = ["install"]
# WebKit, because both browser tiers run on it — see the note in
# playwright.config.ts for why. Chromium is no longer installed: nothing uses
# it, and a second 80MB engine that no test runs is not worth carrying.
#
# `playwright install` rather than the hand-rolled curl-and-unzip this replaced.
# That path fetched linux64 chromium builds by revision and needed a macOS
# branch beside it, so it was two code paths for one job — and the version
# pinning it bought is already in bun.lock, which decides the Playwright that
# reads it. It honours PLAYWRIGHT_BROWSERS_PATH, so browsers still land in
# .playwright/ rather than a per-OS cache outside the project.
#
# Idempotent on its own: it skips anything already present.
run = """
set -e
bun x playwright install webkit
if command -v apt-get >/dev/null 2>&1; then
  bun x playwright install-deps webkit 2>/dev/null || true
fi
"""

[tasks.dev]
description = "The dev server: one port, always current, seeded, reachable from a phone"
depends     = ["setup"]
# One command, one port, and dist/web is never stale.
#
# This used to be three tasks and a footgun. `dev` served the built bundle, so
# every CSS or component change needed a manual `mise run web:build` first —
# which is exactly the mistake that had me measuring a stale stylesheet and
# concluding a fix had not worked. `web:dev` ran a second server on :5175 with
# HMR and a proxy back here, so the two ports disagreed about what the app was.
# `dev:seed` was a third variant that seeded and the others did not.
#
# `vite build --watch` writes into dist/web on every save, and wrangler serves
# that directory, so :8787 is the only address and it is always the current
# code. A change is live on the next page load — no HMR, and that is the trade:
# one honest port beats two that can disagree.
#
# --ip 0.0.0.0 binds every interface; --host is the LAN address so a phone on
# the same wifi can reach it. Sign-in works from localhost and from the LAN
# because trustedOrigins derives from the request URL (src/auth.ts) — the
# convention check requires the flag, not a particular value.
run = """
set -e
IP=$(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null || true)
HOSTARG="${IP:-localhost}"

# The tunnel first, because wrangler reads .dev.vars once at startup and the
# Worker needs TUNNEL_HOSTNAME from it. Writing that file after wrangler had
# already booted meant the first run of the day always failed sign-in through
# the tunnel with INVALID_ORIGIN, and the second run worked — which is a
# miserable thing to debug and was mine.
#
# Sets itself up on first use rather than making anyone remember a separate
# command: tunnel-setup.ts is idempotent, so this is a no-op once the tunnel
# exists. Without a CLOUDFLARE_API_TOKEN there is simply no tunnel, and dev
# carries on with the two local addresses.
TUNNEL=""
RUNTOK=$(printenv TUNNEL_RUN_TOKEN || fnox get TUNNEL_RUN_TOKEN 2>/dev/null) || true
if [ -z "$RUNTOK" ]; then
  bun scripts/tunnel-setup.ts >/dev/null 2>&1 \
    && RUNTOK=$(fnox get TUNNEL_RUN_TOKEN 2>/dev/null) \
    || echo "  (no tunnel — needs CLOUDFLARE_API_TOKEN with Cloudflare Tunnel:Edit)"
fi
if [ -n "$RUNTOK" ]; then
  # `wrangler dev --host` rewrites the Host the Worker sees, so a request made
  # to the tunnel arrives claiming to be the LAN address while the browser's
  # Origin header still says the tunnel. Better Auth refuses that mismatch.
  # This is the one name that cannot be derived from the request.
  # .dev.vars is local and gitignored, so nothing reaches production.
  grep -q '^TUNNEL_HOSTNAME=' .dev.vars 2>/dev/null \
    || echo 'TUNNEL_HOSTNAME={{env.TUNNEL_HOSTNAME}}' >> .dev.vars
  cloudflared tunnel run --token "$RUNTOK" >/dev/null 2>&1 &
  TUNNEL=$!
fi

bun x vite build --config src/web/vite.config.ts --watch --logLevel warn &
WATCH=$!
bun x wrangler dev --ip 0.0.0.0 --host "$HOSTARG" --port 8787 &
SERVER=$!

trap 'kill $WATCH $SERVER $TUNNEL 2>/dev/null || true' EXIT INT TERM

for _ in $(seq 1 40); do
  curl -sf -o /dev/null http://127.0.0.1:8787/api/health && break
  sleep 1
done
curl -sf -X POST http://127.0.0.1:8787/api/seed >/dev/null 2>&1 && echo "  seeded" || echo "  seed failed"

echo ""
echo "  http://localhost:8787            this machine"
[ -n "$IP" ] && echo "  http://$IP:8787      same wifi"
if [ -n "$TUNNEL" ]; then
  echo "  https://{{env.TUNNEL_HOSTNAME}}   fixed URL, works anywhere"
else
  echo "  (no tunnel — 'mise run tunnel:setup' once for a fixed public URL)"
fi
echo "  #/login                          twelve seeded people, one click"
echo "  rebuilds on save — reload to see changes"
echo ""
wait $SERVER
"""

[tasks.verify]
description = "The fast loop: typecheck and unit tests, in parallel, in about six seconds"
# The rung that was missing. There was the 28s gate or the tiers by hand, and
# nothing in between — so the inner loop was either expensive or improvised, and
# improvised mostly meant skipped.
#
# Typecheck is 6.3s and carries most of the signal in a codebase this typed;
# unit is 0.4s. In parallel that is the length of the typecheck, which is the
# floor. `test:worker` (11s) and `test:render` (18s) would each more than double
# it, so this names the one you owe rather than running it — a fast check you
# actually run beats a thorough one you avoid.
#
# `check` is still the pre-commit gate. This is for the thirty times before it.
run = """
mise run typecheck ::: test:unit

changed=$(git diff --name-only HEAD 2>/dev/null; git diff --name-only --cached 2>/dev/null)
tier=""
case "$changed" in *src/web/*) tier="test:render" ;; esac
case "$changed" in *src/api/*|*src/db/*|*src/domain/*) tier="test:worker" ;; esac
[ -n "$tier" ] && echo "  verify: you touched code $tier covers — run it before you commit"
exit 0
"""

[tasks.watch]
description = "Run verify on every save — the loop with no command in it"
depends     = ["install"]
# `verify` is 1.75s. That is the number that makes this worth having: a check you
# have to ask for gets run at the end of a change, and a check that has already
# run is one you read.
#
# Ctrl-C stops it. It ignores src/paraglide, which `verify` itself regenerates —
# watching that is an infinite loop at full CPU.
run = "bun scripts/watch.ts"

[tasks.check]
description = "Type check, dead code, and documented paths — the three things that rot quietly"
# `web:build` is a dependency rather than a line in the script, so mise builds
# it once for this task and for `test:render`, which needs it too.
depends     = ["cf:types", "web:build"]
# No `sources`/`outputs`: dead-code and docs drift depend on files this task
# does not read as inputs (a deleted importer, an edited .md), so caching this
# would skip exactly the run that would have caught the drift.
run = """
# ── Two phases, and the split is not arbitrary ───────────────────────────────
#
# This was seventeen `mise run` lines in a column, executed one after another on
# a twelve-core machine, for work that is almost entirely independent and
# entirely on localhost. Typechecking the Worker has nothing to say to the
# dead-code sweep. That sequence was not a decision, it was the shape a list of
# commands happens to have. 35s -> 26s.
#
# `:::` is what separates tasks. Without it mise takes everything after the
# first name as *arguments to that task* and silently runs one thing — the
# first version of this reported eight seconds and skipped every test tier,
# which is the kind of green nobody should trust.
#
# **`test:worker` gets the machine to itself.** Three of its tests ask the
# Worker for `/` and for the hashed bundle, which go through Miniflare's local
# ASSETS server — and that answers 404 when the box is busy. It is not one
# conflicting task: paired with any single check it passes, and it fails
# against the whole group. Cumulative load, nothing else.
#
# The failure is local infrastructure, not product behaviour: on Cloudflare,
# ASSETS is a platform service and cannot be starved by a laptop compiling
# TypeScript. So the tests stay honest and the schedule works around them —
# masking it with a retry would hide a real 404 the day one appears.
#
# Everything else goes together, render included: it drives WebKit against a
# static `vite preview` and touches no Worker binding, so it is happy under
# load. It also dominates the group at ~15s, which the cheap checks fill.
# The two heavy tiers together, then everything cheap. Not one group of fifteen:
# with worker and render in the same pile as thirteen other jobs the gate was
# 33s, because both of them slowed down more than the cheap work saved. Two
# phases is 27s, from ~37s serial.
#
# BUDGET_SHARED tells check-budget which ceiling applies. `test:worker` is 12.6s
# alone and 26.8s beside render — the gate doing its job, not a regression, and
# one ceiling cannot describe both.
BUDGET_SHARED=1 mise run test:render ::: test:worker

mise run typecheck:clean ::: test:unit ::: test:worker:assets \
  ::: check:dead ::: check:docs ::: check:authz ::: check:conventions \
  ::: check:seed ::: check:domain ::: check:tables ::: check:assets \
  ::: check:messages ::: check:deps ::: check:i18n ::: i18n:validate \
  ::: check:notifications ::: check:gui ::: check:bundle ::: check:envs
"""

[tasks."test:unit"]
description = "Pure-logic tests — no server, no database, no browser (~20ms)"
depends     = ["install"]
# The fast oracle, and the thing this repo went without for too long. Every
# test was a Playwright spec: 157 of them, 3.4 minutes, requiring wrangler dev,
# a migrated D1 and seeded fixtures. That is a fine way to check a page renders
# and a hopeless way to check that a Thai-only name keeps its pivot, or that an
# event is still "live" on its final day.
#
# It matters most for agent-driven work. At 3.4 minutes the loop is "make
# fifteen edits, test once, and guess which one broke it". At 20ms it is per
# change. bun's runner, so no new dependency.
#
# `.test.ts` under tests/unit/, deliberately: Playwright owns `.spec.ts`, so the
# two suites cannot collect each other's files.
run = """
# Timed, and the number is printed on every run. A tier that got six times
# slower went unnoticed for a whole session because nothing ever said how long
# it took — see scripts/check-budget.ts.
start=$(date +%s%N)
bun test tests/unit/
bun scripts/check-budget.ts unit $(( ($(date +%s%N) - start) / 1000000 ))
"""

[tasks."check:dead"]
description = "Fail on unreachable files and on imports missing from package.json"
depends     = ["install"]
# Scope is deliberate. `files` catches orphans — the oRPC migration left four,
# and they were found by hand-grepping, badly: a grep for `views/versions`
# missed `from "./versions"` and wrongly called a live file dead. `unlisted`
# catches an import that resolves only as somebody else's transitive
# dependency, which breaks the day that parent drops it.
#
# Unused *exports* are NOT enforced. That report is ~35 entries here, most of
# them deliberate — access-control roles declared as a set, drizzle relations,
# schemas kept beside the ones in use. A check that is mostly false positives
# gets ignored, and then the real finding is ignored with it. Run the full
# report by hand when you want it:  bun x knip
run = "bun x knip --include files,unlisted --no-config-hints"

[tasks."check:bundle"]
description = "The service worker carries no server or app code"
# depends on the build, not on install: it asserts on dist/web/sw.js.
#
# sw.ts imports a type from src/api/push.ts so the worker and the sender cannot
# drift about the payload. `verbatimModuleSyntax` makes that import provably
# erasing — but only for the type. Adding a shared *const* to the same module
# and importing it typechecks fine, and took the worker bundle from 19,791
# bytes to 387,122 with drizzle in it. See scripts/check-bundle.ts.
depends     = ["web:build"]
run         = "bun scripts/check-bundle.ts"

[tasks."check:notifications"]
description = "Everything the platform sends you can be turned off"
depends     = ["install"]
# The settings page listed three of the five notification types the Worker
# actually sends. EVENT_REMINDER and ROSTER_CHANGE arrived on people's phones
# with no way to stop them, because the invariant was a comment asking to be
# remembered. See scripts/check-notifications.ts.
run = "bun scripts/check-notifications.ts"

[tasks."check:gui"]
description = "Report how much of the API the SPA actually reaches"
depends     = ["install"]
# Not a threshold — it fails only on a stale exemption. The number is a report
# to act on: a field returned on every request and rendered by nothing is work
# that is paid for and invisible. See scripts/gui-coverage.ts.
run = "bun scripts/gui-coverage.ts"

[tasks."check:docs"]
description = "Fail when the documentation names a file that does not exist"
# The companion to check:dead, and the one that matters more: AGENTS.md is read
# at the start of every session, so a wrong path there becomes wrong work. See
# ADR 020 for the failure that prompted it.
#
# It cannot catch prose that is wrong while every path in it resolves. Nothing
# can. That is what the AGENTS.md convention is for.
run = "bun scripts/docs-check.ts"

[tasks."test:worker"]
description = "Worker tests in workerd — real D1, no wrangler dev, no browser"
# `web:build`, not just `install`. These tests reach the SPA through Miniflare's
# ASSETS binding, which reads dist/web off the disk — so with no bundle, or a
# bundle half-written by the dev server's watcher, they fail on a missing asset
# and look like a real regression. That happened three times in one session and
# cost a debugging detour each time.
#
# It is a cached task, so this is free when the bundle is current.
depends     = ["install", "web:build"]
# The tier this repo was missing. 61 of the 151 Playwright specs never opened a
# browser: they were HTTP calls against the Worker, paying for a wrangler dev
# server and a Playwright runner to make them. Here the Worker is loaded into
# the test process and SELF.fetch() calls its handler directly, against real
# Miniflare D1 with the real migrations applied.
#
#   test:unit    pure logic, no runtime      ~20ms
#   test:worker  the Worker, in workerd      this
#   test         a real browser, and only that
run = """
# Timed, and the number is printed on every run. A tier that got six times
# slower went unnoticed for a whole session because nothing ever said how long
# it took — see scripts/check-budget.ts.
start=$(date +%s%N)
# Everything except the three ASSETS assertions, which live in
# tests/worker/assets.test.ts and run alone — see `test:worker:assets`. Excluded
# rather than left in, so this tier can run beside the rest of the gate.
bun x vitest run --config vitest.config.ts --exclude "tests/worker/assets.test.ts"
bun scripts/check-budget.ts worker $(( ($(date +%s%N) - start) / 1000000 ))
"""

[tasks."test:worker:assets"]
description = "The two worker tests that reach the SPA through Miniflare's ASSETS server"
depends     = ["install", "web:build"]
# These want the machine to themselves. Miniflare's local ASSETS server answers
# 404 under load — not one conflicting task, cumulative load — so `check` runs
# every other tier in parallel and then this, alone.
#
# It used to be the whole worker tier standing aside: 13.4s of a ~37s gate, for
# two tests in one file out of thirteen. The gate now pays one file's workerd
# startup instead of the tier's.
#
# The failure is local infrastructure, not product behaviour: on Cloudflare,
# ASSETS is a platform service and cannot be starved by a laptop compiling
# TypeScript. Masking it with a retry would hide a real 404 the day one appears.
run = "bun x vitest run --config vitest.config.ts tests/worker/assets.test.ts"

[tasks."data:coverage"]
description = "Which of the model's vocabulary the fixtures exercise, and which fields have no column"
depends     = ["install"]
# Reported, not enforced. Two of the three sections are judgement calls the
# Product Owner owns — PILOT_SCOPE says which of the sport the product runs —
# and the third, fields with no column, is where the model and the schema
# actually disagree. That one found four on 2026-08-29, including a user
# lifecycle nothing implemented.
run = "bun scripts/data-coverage.ts"

[tasks."check:authz"]
description = "Fail if any procedure does not declare how it is authorised"
depends     = ["install"]
# The check that would have caught Web Push shipping with no authorisation at
# all. It walks the real router — not the source — so a procedure cannot be
# reachable and invisible to it, and it prints every escape hatch on every run
# because an unreviewed exception is the whole failure mode.
run = "bun scripts/check-authz.ts"

[tasks."check:conventions"]
description = "Fail when the code stops obeying a rule AGENTS.md states"
# The third leg, and the one that exists because this repo is agent-built.
# An agent reads AGENTS.md every session and believes it — it has no memory to
# contradict a stale rule with, so it builds on it. This makes the load-bearing
# claims executable instead of merely written.
#
# A failure means the code regressed OR the rule changed. Both need a human, and
# neither is resolved by deleting the check: change AGENTS.md and the rule
# together, in one commit.
run = "bun scripts/check-conventions.ts"

[tasks.probe]
description = "Typecheck a throwaway snippet against the real project (PROBE=path, or stdin)"
depends     = ["install"]
# Measure instead of asserting. Every wrong belief corrected in the ADR-020
# session was killed by exactly this: write a file, typecheck it, delete it.
# Four beliefs, about a minute each — cheaper than being wrong in a document.
#
#   echo 'import type { Router } from "./src/api/index"; export type P = Router' | mise run probe
#
# Writes to .probe.ts at the repo root and always removes it, so a failed probe
# cannot leave a file that breaks the next `mise run check`.
# WEB=1 probes the SPA instead of the Worker. The two have different tsconfigs
# (react vs hono JSX, and only the Worker's includes worker-configuration.d.ts),
# and which one you probe is usually the question — that difference is exactly
# what ADR 016 §1 turned out to hinge on.
#
# The file lands INSIDE src/ so the project tsconfig governs it; a root-level
# file is outside `include`, and tsc then resolves node_modules differently and
# reports phantom "Cannot find module '@orpc/server'" errors.
run = """
if [ -n "${WEB:-}" ]; then TARGET=src/web/__probe.ts; CFG="-p src/web/tsconfig.json"
else TARGET=src/__probe.ts; CFG=""; fi
trap 'rm -f "$TARGET"' EXIT
if [ -n "${PROBE:-}" ]; then cp "$PROBE" "$TARGET"; else cat > "$TARGET"; fi
echo "--- probing ${TARGET} ---"
bun x tsc --noEmit $CFG || true
echo "--- done (nothing above = it typechecks) ---"
"""

[tasks."test:all"]
description = "Every tier, with the wall-clock time each one costs"
# The number that matters is where the seconds go. Anything that grows here is
# a test in the wrong tier — `mise run test:tiers` says which.
#
# Output is captured rather than discarded, and replayed when a tier fails. The
# earlier `>/dev/null 2>&1` printed nothing but `test:worker FAILED`, so finding
# out *which* test failed meant running the tier again by hand — the timing
# report cost you the failure report.
run = """
set -e
log="$(mktemp -t test-all)"
trap 'rm -f "$log"' EXIT
for t in test:unit test:worker test:render test; do
  start=$(date +%s)
  if ! mise run $t >"$log" 2>&1; then
    echo "  $t FAILED"
    echo
    cat "$log"
    exit 1
  fi
  printf "  %-14s %ss\n" "$t" "$(( $(date +%s) - start ))"
done
"""

[tasks."test:render"]
description = "Rendering tests against a static server — no Worker, no database, no sign-in"
depends     = ["web:build"]
# Own config because Playwright's webServer is config-wide: these need `vite
# preview` over dist/web, while the e2e tier needs wrangler, a migrated D1 and
# six signed-in actors. They were paying for all of that to check a <div>.
#
# These run happily while `mise run dev` is up. That took a fix in
# vite.config.ts — `preview.proxy` defaults to `server.proxy`, so this tier was
# reaching a real Worker whenever one existed — not a separate build directory,
# which is what I tried first and which fixed nothing.
run = """
# Timed, and the number is printed on every run. A tier that got six times
# slower went unnoticed for a whole session because nothing ever said how long
# it took — see scripts/check-budget.ts.
start=$(date +%s%N)
bun x playwright test --config playwright.render.config.ts
bun scripts/check-budget.ts render $(( ($(date +%s%N) - start) / 1000000 ))
"""

[tasks."seed:sql"]
description = "Regenerate src/db/seed.sql from the biz fixtures — the seed as data, not an HTTP call"
depends     = ["install"]
# The vocabularies have
# always been SQL (migration 0009); the entities went through POST /api/seed,
# which needs a running Worker and therefore a database every spec shares.
# As SQL, each test file seeds its own storage in milliseconds.
# The model is copied in from remy-sport-biz, so the copies are the input —
# The model is the input; there is no re-export layer between them any more.
sources = ["scripts/seed-sql.ts", "src/domain/model/*.ts", "src/db/*-schema.ts"]
outputs = ["src/db/seed.sql"]
run     = "bun scripts/seed-sql.ts"

[tasks."db:generate"]
description = "Emit a migration for whatever changed in the drizzle schema (prompts on renames)"
depends     = ["install"]
# drizzle-kit diffs src/db/schema.ts against meta/0017_snapshot.json and writes
# only the delta, numbered from 0018 so it never collides with the seventeen
# hand-written and generated migrations already there.
#
# There is deliberately no 0000 baseline .sql: those seventeen already built the
# shape the snapshot records, so emitting one would re-run work that is done.
#
# Run this in a real terminal. A rename asks whether the column was renamed or
# dropped and recreated, and that question needs a person — which is exactly the
# capability the old generate-the-whole-migration approach never had.
run = "bun x drizzle-kit generate"

[tasks."db:studio"]
description = "Browse the local D1 database in Drizzle Studio (developer tool; read-write)"
# Depends on the migrations because Studio reads the schema from the database,
# not from src/db/schema.ts — against a checkout that has never run wrangler
# there is no .sqlite file for drizzle.config.ts to find, and Studio starts with
# no tables and no explanation. Applying migrations is idempotent, so this costs
# nothing once the database exists.
depends = ["install", "cf:d1:migrations:apply"]
#
# Two things this is not:
#
#   - It is not in VS Code. Studio's UI is served from https://local.drizzle.studio
#     and only the data stays local, so this opens a browser tab and needs
#     working internet. There is no first-party Drizzle extension for VS Code.
#   - It is not the remote database. This reads the miniflare file under
#     .wrangler/; production D1 is the Cloudflare dashboard.
#
# Edits made here are real writes to the local database, and they survive
# exactly until the next `mise run cf:d1:reset` or re-seed. Nothing reaches biz.
run = "bun x drizzle-kit studio"

[tasks."check:messages"]
description = "Fail if a released locale is missing a UI message"
depends     = ["install"]
# Paraglide compiles messages to functions, so a missing KEY is a compile error
# — but a missing TRANSLATION is not: it falls through to English and the build
# passes. Verified by deleting one. The model's own values are checked upstream
# by `data:check` in remy-sport-biz; these 113 had nothing.
run = "bun scripts/check-messages.ts"

[tasks."check:i18n"]
description = "Fail if a user-visible string is written into the UI instead of a message"
depends     = ["install"]
# The companion to check:messages, and the one that catches what it cannot.
#
# check:messages asks "does every locale carry every message?" and answers
# 147/147. True, and the wrong question — it cannot see a string that was never
# a message. It was green while ~130 hardcoded English strings shipped: an
# English status chip on every Thai event card, English headers on the admin
# console, "Venue TBC" inside a Thai sentence.
#
# `react/jsx-no-literals` walks the AST and flags a JSXText node — a string in a
# RENDERED position. It cannot confuse that with a comment, a type, a className
# or a data-testid, because those are different nodes. The first attempt at this
# was a regex over the source and it reported `Promise<T>` and a player's name
# as untranslated copy; it found fewer real ones (99) than the AST rule (130)
# while producing noise. Text matching cannot answer an AST question.
#
# There is no suppressions file any more. It started at 130 and was pruned to
# zero, so this is a hard gate: any user-visible string written into the UI
# fails the build, with its file and line. Nothing to grandfather, nothing to
# argue about.
#
# If a genuinely language-neutral token appears — notation like "±", a keyboard
# shortcut, the product's own name — add it to `allowedStrings` in
# eslint.config.mjs with a reason, rather than reintroducing suppressions.
run = "bun x eslint src/web"

[tasks."check:deps"]
description = "Fail if a module imports across a layer boundary, or two modules import each other"
depends     = ["install"]
# The rules are in .dependency-cruiser.cjs with the reasoning beside each one.
# Not a script in scripts/: this is a solved problem, and every other check here
# is bespoke because nothing off the shelf knew about the PO's model. This one
# is a config file and someone else's graph walker.
#
# It found a real cycle the day it was added — src/api/base.ts and
# src/api/relations.ts imported each other, invisible because one side was
# `import type`, which erases before tsc ever forms an opinion.
run = "bun x depcruise src --config .dependency-cruiser.cjs"

[tasks."check:assets"]
description = "Fail if a built asset would shadow a Worker route"
depends     = ["install"]
# Assets are served before the Worker (wrangler.toml), which is right — a hashed
# bundle from the asset store costs nothing where the same request through the
# Worker is billed and logged. The cost is that a new top-level file in dist/web
# could silently win a Worker route: /doc would start returning a static file and
# nothing would throw. The Worker's routes come from Hono itself, so this cannot
# fall behind them.
#
# Skips with a message when dist/web is absent rather than passing on nothing.
run = "bun scripts/check-assets.ts"

[tasks."check:envs"]
description = "Fail if two environments share a hostname, database, bucket, queue or dataset"
depends     = ["install"]
# Named environments inherit some top-level keys, and the inherited ones are the
# hazard: an [env.staging] with no `routes` override resolves to production's
# hostname, so `deploy --env staging` publishes a staging build onto the domain
# real people use.
#
# Wrangler warns about that when the route is a custom domain and says nothing
# at all when it is an ordinary route pattern — measured both ways. So the
# warning is real but conditional on a config detail unrelated to environments,
# and this check is what does not depend on it.
#
# Reads resolved config through wrangler's own reader rather than parsing
# wrangler.toml, because the hazard is what the file does NOT say.
run = "bun scripts/check-envs.ts"

[tasks."check:tables"]
description = "Fail if the model names a table this schema does not have"
depends     = ["install"]
# FIXTURE_TABLE and an object type's table_name are authored, and a wrong entry
# is not a type error — it is a query against a table that does not exist, on
# the one path that uses it. ORG named `organizations` after that table was
# dropped, and every write to an organisation answered 500.
run = "bun scripts/check-tables.ts"

[tasks."check:seed"]
description = "Fail if src/db/seed.sql is stale against the fixtures"
depends     = ["install"]
# seed.sql is committed, because the Worker imports it and the worker tests
# apply it. A committed generated file is a file that can go stale, and this one
# decides what every tier believes the database contains — so regenerate into a
# temp file and diff rather than trusting that whoever changed the fixtures also
# ran the generator.
run = """
bun scripts/seed-sql.ts >/dev/null
git diff --quiet -- src/db/seed.sql || {
  echo "seed.sql is stale — run 'mise run seed:sql' and commit the result:"
  git --no-pager diff --stat -- src/db/seed.sql
  exit 1
}
echo "check-seed: seed.sql matches the model"
"""

[tasks."fonts:vendor"]
description = "Download the web fonts into src/web/fonts/ and regenerate fonts.css"
depends     = ["install"]
# `sources`/`outputs` so `setup` can depend on this without hitting the network
# every run: it re-downloads only when the declared locales or the script change.
# The output is committed too, so a clean build never needs a connection at all.
#
# Subsets are DERIVED from ALL_LOCALES — adding a language upstream widens them
# automatically. See the script for why CJK is deliberately not self-hosted.
sources = ["scripts/fonts-vendor.ts", "src/domain/vocabularies.ts"]
outputs = ["src/web/fonts.css"]
run     = "bun scripts/fonts-vendor.ts"

[tasks."test:tiers"]
description = "How many tests are in each tier, and how many are still in the wrong one"
# Makes the tier split measurable rather than a
# claim. Optimising the runner bought 2.8m -> 1.6m and then stopped; the number
# that matters is how many browser tests exist at all.
run = "bun scripts/test-tiers.ts"

[tasks.test]
description = "Run Playwright tests locally"
depends     = ["setup"]
run = """
# Timed, and the number is printed on every run. A tier that got six times
# slower went unnoticed for a whole session because nothing ever said how long
# it took — see scripts/check-budget.ts.
start=$(date +%s%N)
bun x playwright test
bun scripts/check-budget.ts e2e $(( ($(date +%s%N) - start) / 1000000 ))
"""

# ── Demo sign-in ────────────────────────────────────────────────────────────
# Lets the twelve seeded people sign in on a deployment with one click. Their
# addresses are `.test` so nothing delivers to them, and the dev outbox does not
# exist on a deployment — a fixed code is the only way in.
#
# A Worker secret rather than a [vars] entry, and not because the value is
# secret: it is published to the browser with the account list, and the login
# page labels it. It is a secret because a secret changes WITHOUT a redeploy,
# and a switch you may need off in a hurry should not need a commit and a build.

[tasks."demo:on"]
description = "Let the seeded people sign in on a deployment (published code; never the admin)"
depends     = ["install"]
# Production only, and that is the whole reason this task still exists after the
# provisioning consolidation. `signInCode` in src/environment.ts says dev and
# staging DERIVE their code — there is nothing to set and nothing to forget —
# while production is "secret" precisely so a person decides when seeded sign-in
# is on, and can take it away again without a redeploy.
#
# The seeded ADMIN is excluded in src/auth.ts on any deployment: that account can
# impersonate, which is the one power reaching a real person.
#
# It ENDS BY ASKING THE DEPLOYMENT. `demo:status` reads /api/dev/accounts and
# fails if the code is not actually being served, because "the secret was put"
# and "seeded sign-in works" are different claims and only the second one
# matters. This task was silently a no-op on production for a whole commit —
# the code was gated on a policy row production does not have — and nothing
# said so until the next deploy. A provisioning task that cannot tell you
# whether it worked is the failure class this week has been about.
run = "bun scripts/cf-demo.ts on"

[tasks."demo:off"]
description = "Stop the seeded people signing in on a deployment"
depends     = ["install"]
# Run this before the platform has real users. A demo account cannot reach
# anyone else's data, but it can edit shared fixture data — and once real events
# exist, those are not fixtures any more.
#
# Safe to run twice: an already-absent secret is the desired state, not an
# error. The previous version deleted unconditionally and failed when there was
# nothing to delete, which made "make sure demo is off" a command you could not
# confidently run.
#
#   mise run demo:off -- --env production
run = "bun scripts/cf-demo.ts off"

[tasks."demo:status"]
description = "Is seeded sign-in on, and who does it offer?"
depends     = ["install"]
# Asks the deployment rather than the config: what is set and what is *serving*
# are different questions, and only the second one matters.
run = "bun scripts/demo-status.ts"

[tasks."model:coverage"]
description = "Which of the Product Owner's actions the API actually implements"
depends     = ["install"]
# Not part of `check`, and not a build failure: most of these are unbuilt on
# purpose and the roadmap says so. What was missing was a way to SEE it — the
# API had no way to create a game at all, the model said an organiser schedules
# fixtures, and nothing connected the two until someone read the router by hand.
run = "bun scripts/model-coverage.ts"

[tasks.shots]
description = "Screenshot every screen in every released language into screenshots/"
depends     = ["setup"]
# Not part of `test`, and not a test: nothing here asserts. It exists because a
# green suite says a page works, not that it looks right — see
# tests/e2e/screens.shots.ts for the two bugs that got through a green suite
# and were obvious in a picture.
#
# `screenshots/` is gitignored. The files are build output regenerated by this
# task, and committing a few hundred KB of PNG per run would put the repo's
# history to work storing pictures. They land in the working tree, which is what
# makes them openable in an editor — the reason they were unreachable in /tmp.
run = "bun x playwright test --config playwright.shots.config.ts"

[tasks.versions]
description = "Generate versions.json"
run         = "bun scripts/versions.ts"

[tasks."dev:ensure"]
description = "Make sure the dev server is up, starting it if not. Idempotent — use this, never pkill"
# No `depends` on purpose. It used to declare `setup` and then run `mise run
# dev`, which declares `setup` as well — and only 3 of setup's 7 dependencies
# are cached, so migrations and `playwright install` ran twice on every restart.
# The `dev` it delegates to still resolves `setup`, so nothing is skipped; it is
# resolved once instead of twice.
#
# The early exit matters more: when a server is already up this now does one
# curl, where before it ran the whole of `setup` before discovering there was
# nothing to do.
# The one way to get a dev server. Use this instead of starting things by hand.
#
# It used to launch a bare `wrangler dev --host localhost`: no SPA watcher, no
# tunnel, no seed. So the server you got from `dev:ensure` was not the server
# you got from `dev`, and which one was running decided whether a change
# appeared, whether the tunnel answered, and whether there was any data. That is
# a fourth permutation of "the dev server" and it existed only because this task
# reimplemented a stripped-down copy of another one. It delegates now.
#
# Idempotent, and that is the point: it no-ops when something is already
# serving. Reaching for `pkill` and `nohup` instead is what produced a whole day
# of measuring stale bundles — the server would be half-replaced, or two would
# race for the port, and the thing on screen was not the thing on disk.
#
# Waits for readiness by polling rather than sleeping. `mise run dev` is ready
# in about two seconds; a fixed `sleep 40` after it turns a fast loop into a
# slow one and teaches you the tooling is slow when it is not.
run = """
if curl -sf -o /dev/null {{env.DEV_URL}}/api/health 2>/dev/null; then
  echo "dev:ensure: already serving on {{env.DEV_URL}}"
  exit 0
fi
mkdir -p .wrangler
echo "dev:ensure: starting..."
nohup mise run dev >.wrangler/dev.log 2>&1 &
for _ in $(seq 1 60); do
  if curl -sf -o /dev/null {{env.DEV_URL}}/api/health 2>/dev/null; then
    echo "dev:ensure: serving on {{env.DEV_URL}}"
    exit 0
  fi
  sleep 0.5
done
echo "dev:ensure: did not become ready — see .wrangler/dev.log" >&2
exit 1
"""

[tasks."dev:restart"]
description = "Stop and restart the dev server, waiting for it. For .dev.vars or mise.toml changes only"
# The only three things that need one: editing the `dev` task itself, changing
# .dev.vars (wrangler reads it once at boot), or a wedged process.
#
# A change to src/ needs NOTHING — wrangler reloads the Worker and vite rebuilds
# the SPA, both in about a second. Restarting for a code change is the habit
# that made a one-second loop feel like a minute.
run = """
mise run dev:stop
mise run dev:ensure
"""

[tasks."dev:stop"]
description = "Stop the dev server and everything it started (idempotent)"
# All three, not just wrangler. `dev` runs a vite watcher and a cloudflared
# tunnel beside it, and stopping only the Worker left both orphaned — a watcher
# still writing dist/web for a server that was gone, and a tunnel still holding
# the public hostname open. Ctrl-C on `dev` handles this through its trap; this
# is for when the process is not in front of you.
#
# Scoped to this checkout by working directory, because `pkill -f "wrangler
# dev"` matches every wrangler on the machine: another project's dev server, and
# — worse, because it looks like a flaky test — the one Playwright starts for
# itself as its `webServer`. Killing that mid-run fails the e2e tier for reasons
# that have nothing to do with the code.
run = """
STOPPED=""
for pat in "wrangler dev" "vite build --config src/web/vite.config.ts --watch" "cloudflared tunnel run"; do
  for pid in $(pgrep -f "$pat" 2>/dev/null); do
    # The process's own cwd, which is the only reliable way to tell whose
    # wrangler this is — the command line does not name the project.
    cwd=$(lsof -a -p "$pid" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -1)
    case "$cwd" in
      "{{config_root}}"|"{{config_root}}"/*) kill "$pid" 2>/dev/null && STOPPED="yes" ;;
    esac
  done
done
[ -n "$STOPPED" ] && echo "dev:stop: stopped" || echo "dev:stop: nothing running here"
"""

[tasks.seed]
description = "Seed local D1 with dev users (requires running dev server)"
# See the pipefail note on seed:remote.
run = """
set -o pipefail
curl -sf -X POST {{env.DEV_URL}}/api/seed | jq .
"""

[tasks.deploy]
description = "Full deploy pipeline"
# Sequencing lives in the run block, NOT in depends (ADR 006 §8). mise runs
# independent sibling dependencies in parallel — it honours the dependency
# graph, not list order — so the old flat depends list let test:deployed race
# cf:deploy and seed:remote race the remote migrations.
#
# Chaining the tasks through depends was rejected: it would couple them, so
# `mise run seed:remote` would trigger a full deploy as a side effect. Ordering
# is a property of this pipeline, not of the individual tasks.
#
# Migrations run BEFORE cf:deploy, and after cf:env:bootstrap creates the D1
# database they need. They used to run after the deploy, which was survivable
# only while every migration was additive — old code simply ignored the new
# columns. Migration 0007 broke that assumption: better-auth 1.7 matches
# sign-in against account.issuer, so a Worker deployed ahead of it queries a
# column that does not exist yet and every sign-in fails until the migration
# lands. Migrate first, then deploy code that depends on the migration.
depends     = ["setup"]
run = """
set -e
mise run check
mise run auth:schema:check
mise run test
mise run versions
# One call, not four. Bootstrap does D1, its migrations, R2, both queues and
# every secret — and it is idempotent, so the pre-deploy run creates what is
# missing and the post-deploy run fills in the secrets that needed the Worker to
# exist first.
#
# Secrets before the code, so the version cf:deploy publishes is the last one and
# is already complete. Putting a `wrangler secret put` *after* the deploy
# publishes a further version, and for a few seconds the edge still answers from
# the one before it — which failed the push smoke check on a deploy where the
# keys had in fact been set correctly.
mise run cf:env:bootstrap -- --env production
mise run cf:deploy
mise run cf:wait
mise run seed:remote -- --env production
mise run cf:smoke
"""

# ── Remote / test variants ───────────────────────────────────────────────────

[tasks."cf:smoke"]
description = "Verify the deployed Worker — read-only, plus one write that must be a no-op"
depends     = ["install"]
# What `deploy` ends with, instead of test:deployed. See scripts/smoke.ts for
# why pointing the whole suite at production was both unrunnable and a bad idea.
#
# Defaults to production, and CF_DEPLOY_URL points it elsewhere:
#
#   CF_DEPLOY_URL=http://localhost:8787            mise run cf:smoke
#   CF_DEPLOY_URL=https://$TUNNEL_HOSTNAME         mise run cf:smoke
#
# Those two used to be permanently three-red — the checks asserting a
# deployment refuses the dev outbox, the seed route and an admin sign-in, all
# of which local dev opens deliberately. They report as skipped now, with the
# reason, so the exit code means something on every surface. An unrecognised
# host is treated as a deployment and gets every check.
run = "bun scripts/smoke.ts"

[tasks."test:deployed"]
description = "Run the Playwright suite against the deployed Worker (needs TEST_OTP; NOT part of deploy)"
env         = { BASE_URL = "{{env.CF_DEPLOY_URL}}" }
# Deliberately not in the deploy pipeline. It requires TEST_OTP as a Worker
# secret, which makes the sign-in code for every seeded address a constant on a
# public site, and it writes as it runs — the `hook-*@remy.dev` accounts in the
# deployed database came from previous runs of this. `mise run cf:smoke` is what
# verifies a deploy. Keep this for deliberate, pre-launch use only.
run = "bun x playwright test"

[tasks."test:grep"]
description = "Run only tests whose title matches GREP (unset GREP runs everything)"
depends     = ["setup"]
# GREP defaults to empty, which matches every title — so the task still runs
# without any user-supplied arg, per the AGENTS.md convention.
run         = 'bun x playwright test --grep "${GREP:-}"'

[tasks."test:ui"]
description = "Run Playwright tests with interactive UI"
run         = "bun x playwright test --ui"

[tasks."seed:remote"]
description = "Seed remote D1 with dev users (idempotent)"
# Applied through wrangler, not through the app. `POST /api/seed` used to be an
# open, unauthenticated write on a public domain — 330 D1 statements per call to
# anyone who found it. Seeding is an operator action and the operator already
# holds Cloudflare credentials, so the endpoint simply does not exist on a
# deployment now, and this needs no HTTP surface to replace it.
#
# Not piped into `jq`, and not parsed at all. Wrangler writes progress to the
# same stdout as its result, so piping killed the deploy with EPIPE, and its
# `--json` output carries a preamble that is not JSON. Its exit code is the
# signal that matters and `set -e` acts on it — which is the same property the
# note above wanted, obtained by not building a pipeline in the first place.
run = "bun scripts/cf-d1.ts seed-remote"

# ── cf:env: provisioning (ADR 006) ───────────────────────────────────────────
# ONE path, for one named environment. cf:d1:create, cf:r2:create, cf:d1:ensure,
# cf:r2:ensure, cf:secret:set, push:secret:set and moq:relay:set were seven
# entry points with three idempotency stories between them; they are now
# internal steps of cf:env:bootstrap. Plan first, apply second, and both run the
# same code.

[tasks."cf:env:plan"]
description = "Print what cf:env:bootstrap would do for an environment. Changes nothing."
depends     = ["install"]
# The half that was missing. The apply was never the frightening part — not
# knowing what it was about to do was. It runs the SAME code as bootstrap and
# differs only in whether the apply step is called, so the plan cannot describe
# a different run from the one that follows it.
#
#   mise run cf:env:plan -- --env staging
run = "bun scripts/cf-provision.ts"

[tasks."cf:env:bootstrap"]
description = "Provision D1, migrations, R2, both queues and every secret for one environment"
depends     = ["install"]
# The description is now true. It used to say "all Cloudflare resources" and run
# three of six: push:secret:set was called separately by `deploy`, moq:relay:set
# and demo:on were called by nothing, and the queues were created by nobody at
# all despite wrangler.toml declaring three of them.
#
# Requires --env and refuses without one. Everything else in this codebase
# resolves unset configuration to production because the risk there is an opened
# door; this performs writes, where the strict answer is to not perform them.
#
#   mise run cf:env:bootstrap -- --env staging
run = "bun scripts/cf-provision.ts --apply"

[tasks."cf:wait"]
description = "Wait until the origin is serving the build that was just deployed"
depends     = ["install"]
# Two distinct problems, both of which broke a deploy:
#
# 1. A freshly bound custom domain is not immediately usable — wrangler creates
#    the DNS record and requests an edge certificate, but propagation and
#    issuance take minutes. The first deploy died with `getaddrinfo ENOTFOUND`.
#
# 2. `wrangler deploy` returns before the new version has propagated. Polling
#    /api/health cannot detect that, because the OLD worker answers it happily
#    — so test:deployed ran against stale code and every organization test 404'd
#    on a route the new build had only just added.
#
# So this compares the build stamp the origin reports against the one in the
# local versions.json (written by `mise run versions` earlier in the pipeline).
# `_generated` rather than the git commit: the commit only changes when you
# commit, so deploying uncommitted work would report a match against stale code.
run = """
set -o pipefail
WANT=$(python3 -c "import json; d=json.load(open('versions.json')); print(d.get('current',d).get('_generated',''))")
if [ -z "$WANT" ]; then
  echo "cf:wait: no _generated stamp in versions.json — run 'mise run versions' first" >&2
  exit 1
fi
for i in $(seq 1 60); do
  GOT=$(curl -sf --max-time 10 {{env.CF_DEPLOY_URL}}/api/versions 2>/dev/null \
        | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('current',d).get('_generated',''))" 2>/dev/null || echo "")
  if [ "$GOT" = "$WANT" ]; then
    echo "cf:wait: {{env.CF_DEPLOY_URL}} is serving $WANT"
    exit 0
  fi
  [ -n "$GOT" ] && echo "cf:wait: origin still serving $GOT, want $WANT"
  sleep 5
done
echo "cf:wait: {{env.CF_DEPLOY_URL}} never reported $WANT within 5 minutes" >&2
exit 1
"""



[tasks."push:keys"]
description = "Generate a VAPID keypair for Web Push (prints three lines; does not store them)"
depends     = ["install"]
# Prints rather than writes, because where the three lines go depends on which
# environment they are for: `.dev.vars` locally, `wrangler secret put` on a
# deployment. Writing them somewhere on the caller's behalf would put a
# production private key in a file by accident.
run = "bun scripts/vapid.ts"


[tasks."dev:vars"]
description = "Write .dev.vars with a generated BETTER_AUTH_SECRET if absent"
# A dependency of `setup`, never run directly. Hidden so `mise tasks` shows the
# four dev commands somebody actually chooses between.
hide        = true
depends     = ["install"]
run         = "bun scripts/dev-vars.ts"

# ── cf: deploy ───────────────────────────────────────────────────────────────

[tasks."cf:deploy"]
description = "Deploy worker (API + SPA) to Cloudflare"
# web:build must run first — wrangler uploads dist/web via the [assets] binding,
# so deploying without a fresh build ships stale or missing GUI assets.
depends     = ["install", "web:build"]
sources     = ["src/**/*.ts", "src/web/**/*", "wrangler.toml", "package.json", "versions.json"]
run         = "bun x wrangler deploy"

[tasks."cf:versions:list"]
description = "List deployed versions"
depends     = ["install"]
run         = "bun x wrangler versions list"

[tasks."cf:versions:upload"]
description = "Upload a version without deploying"
depends     = ["install"]
run         = "bun x wrangler versions upload"

[tasks."cf:versions:deploy"]
description = "Gradual rollout (interactive)"
depends     = ["install"]
run         = "bun x wrangler versions deploy"

[tasks."cf:rollback"]
description = "Roll back to the previous version"
depends     = ["install"]
run         = "bun x wrangler rollback"

[tasks."cf:tail"]
description = "Tail live worker logs"
depends     = ["install"]
run         = "bun x wrangler tail"

[tasks."cf:login"]
description = "Authenticate wrangler with Cloudflare (opens browser)"
depends     = ["install"]
run         = "bun x wrangler login"

[tasks."cf:logout"]
description = "Clear stored Cloudflare credentials"
depends     = ["install"]
run         = "bun x wrangler logout"

[tasks."cf:audit"]
description = "Query the Cloudflare audit log for delete actions (CLOUDFLARE_API_TOKEN from fnox or the environment)"
depends     = ["install"]
# Closes the one open question in the ADR 006 postscript: who removed the
# original worker, D1 and R2. The wrangler OAuth token cannot answer it —
# `wrangler login --scopes-list` has no audit scope at all — so this needs a
# dashboard-created API token.
#
# ADR 006 §"Reading the audit log" documents invoking this as
# `CLOUDFLARE_API_TOKEN=... mise run cf:audit`, and that still works — an
# explicit value in the environment always wins. fnox is only consulted when
# there is nothing to override, which turns the documented one-liner into the
# fallback rather than the requirement.
#
# `fnox get` rather than `fnox exec`: exec would inject every secret declared
# in fnox.toml into this process, and warn on each run about ones unrelated to
# auditing. This pulls exactly the one it needs.
run = """
set -e
if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
  CLOUDFLARE_API_TOKEN=$(fnox get CLOUDFLARE_API_TOKEN 2>/dev/null) || true
  export CLOUDFLARE_API_TOKEN
fi
bun scripts/cf-audit.ts
"""

[tasks."time"]
description = "Time a local endpoint — min/p50/p95/max over N runs (`mise run time /api/health`)"
depends     = ["install"]
# The counterpart to `probe`. That one settles a question about types by writing
# a file and typechecking it; this settles a question about speed by making the
# request and timing it.
#
# It exists because an hour went into guessing why one endpoint took 0.23s — a
# cause named without evidence, a correct diagnosis retracted on one bad
# experiment — and the settling test took two minutes once somebody ran it.
# Nothing in the repo measured latency, so the first move was assertion.
#
#   mise run time /api/games?eventId=evt_002
#   COOKIE="$(cat .session)" mise run time /api/events 50
run = "bun scripts/time.ts \"$@\""

[tasks."analytics"]
description = "Report what the deployed worker has been doing (Analytics Engine; hours as arg, default 24)"
depends     = ["install"]
# Analytics Engine has no dashboard. The data is reachable only over a SQL API,
# so without this task everything src/analytics.ts writes is a write-only pipe
# that feels like observability and is not.
#
# Same credential path as cf:audit, for the same reason: the wrangler OAuth
# token has no analytics scope (`wrangler login --scopes-list` lists none), so
# this needs a dashboard-created API token with Account Analytics: Read.
run = """
set -e
if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
  CLOUDFLARE_API_TOKEN=$(fnox get CLOUDFLARE_API_TOKEN 2>/dev/null) || true
  export CLOUDFLARE_API_TOKEN
fi
bun scripts/analytics.ts "$@"
"""

[tasks."cf:whoami"]
description = "Show current Cloudflare auth info"
depends     = ["install"]
run         = "bun x wrangler whoami"

[tasks."cf:secret:list"]
description = "List secrets set on the worker"
depends     = ["install"]
run         = "bun x wrangler secret list"

[tasks."cf:types"]
description = "Generate TypeScript types from wrangler bindings (worker-configuration.d.ts)"
depends     = ["install"]
run         = "bun x wrangler types"

# ── cf:d1: database ──────────────────────────────────────────────────────────

[tasks."cf:d1:list"]
description = "List D1 databases"
depends     = ["install"]
run         = "bun x wrangler d1 list"

[tasks."cf:d1:list:json"]
description = "List D1 databases as JSON (machine-readable)"
depends     = ["install"]
run         = "bun x wrangler d1 list --json"


[tasks."cf:d1:tables"]
description = "List tables in local D1"
depends     = ["install"]
run         = "bun scripts/cf-d1.ts tables-local"

[tasks."cf:d1:tables:remote"]
description = "List tables in remote D1"
depends     = ["install"]
run         = "bun scripts/cf-d1.ts tables-remote"

[tasks."cf:d1:migrations:create"]
description = "Create a new D1 migration (set NAME env var)"
depends     = ["install"]
run         = "bun x wrangler d1 migrations create remy-sport-db \"$NAME\""

[tasks."cf:d1:migrations:apply"]
description = "Apply D1 migrations locally (idempotent)"
depends     = ["install"]
run         = "bun scripts/cf-d1.ts migrate-local"

[tasks."cf:d1:migrations:apply:remote"]
description = "Apply D1 migrations to remote (idempotent)"
depends     = ["install"]
run         = "bun scripts/cf-d1.ts migrate-remote"

# Wrangler records which migrations it has applied and never re-runs one. That
# is right for hand-written migrations and wrong for 0009, which
# Migrations are drizzle-kit's and reference rows are the seed's, so a model
# change is a re-seed rather than a replay — but a schema change still needs one.
# old vocabulary while the generated TypeScript moves on. Dropping the local
# state and replaying is the only way to pick it up.
[tasks."cf:d1:reset"]
description = "Delete the local D1 database and replay every migration from scratch. Use when a migration has changed under a database that already ran it — wrangler will not re-apply one. Local only; never touches remote."
depends     = ["install"]
run = "bun scripts/cf-d1.ts reset-local"

# ── cf:r2: storage ───────────────────────────────────────────────────────────

[tasks."cf:r2:list"]
description = "List R2 buckets"
depends     = ["install"]
run         = "bun x wrangler r2 bucket list"


[tasks."cf:r2:objects"]
description = "List objects in the R2 bucket"
depends     = ["install"]
run         = "bun x wrangler r2 object list remy-sport-storage"

# ── Web app (src/web/) ──────────────────────────────────────────────────────

[tasks."web:build"]
description = "Production build → dist/web/"
depends     = ["install"]
# Declared so the build actually skips when nothing changed, per the AGENTS.md
# idempotency convention. This matters most for Tauri: tauri.conf.json runs
# `mise run web:build` itself via beforeDevCommand/beforeBuildCommand, so
# without these the SPA was rebuilt twice on every `mise run tauri:build`.
#
# src/paraglide and src/domain are in this list because the SPA imports both,
# and leaving them out was a staleness bug with teeth: adding a message,
# compiling it with `i18n:generate` and running `web:build` reported "sources
# up-to-date, skipping" and shipped a bundle without the new string. A
# translation could have passed every check and deployed missing. The rule is
# that `sources` lists what the build READS, not what lives in its own folder.
sources     = [
  "src/web/**/*",
  "src/paraglide/**/*",
  "src/domain/**/*",
  "messages/*.json",
  "package.json",
  "bun.lock",
]
outputs     = ["dist/web/index.html"]
# Defers to the dev server's watcher, because both write dist/web and vite
# empties it first.
#
# `mise run dev` runs `vite build --watch` against this same config and output
# directory. Edit an SPA file with the dev server up and both builders wake:
# `web:build` because its `sources` changed, the watcher because the file did.
# Whichever empties the directory second leaves the other's output gone, and the
# window is wide enough to matter — a whole e2e suite failed with "element not
# found" on 8 specs, because the shell was being served with no bundle at all.
# That reads as a product regression and is a build race.
#
# The watcher is authoritative when it exists: it is already rebuilding on every
# save, so the bundle it produces is at least as fresh as this task's. Scoped by
# working directory for the same reason `dev:stop` is — the config path is
# relative, so a bare pattern matches any checkout on the machine.
run = """
for pid in $(pgrep -f "vite build --config src/web/vite.config.ts --watch" 2>/dev/null); do
  cwd=$(lsof -a -p "$pid" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -1)
  case "$cwd" in
    "{{config_root}}"|"{{config_root}}"/*)
      # Wait for the in-flight rebuild rather than assuming it finished.
      for _ in $(seq 1 40); do
        [ -f dist/web/index.html ] && exit 0
        sleep 0.25
      done
      echo "web:build: the dev watcher holds dist/web and produced no index.html" >&2
      echo "  it may have failed to build — check .wrangler/dev.log" >&2
      exit 1
      ;;
  esac
done
bun x vite build --config src/web/vite.config.ts
"""

[tasks."web:typecheck"]
description = "TypeScript type-check src/web/ (no emit)"
depends     = ["install"]
run         = "bun x tsc -p src/web/tsconfig.json --noEmit"

[tasks."web:deploy"]
description = "LEGACY — deploy SPA to Pages (superseded: cf:deploy now ships it same-origin)"
depends     = ["web:build"]
run         = "bun x wrangler pages deploy dist/web --project-name=remy-sport-design --branch=main --commit-dirty=true"

# ── Tauri (Desktop + iOS) ───────────────────────────────────────────────────
# The Tauri CLI is pinned in package.json (npm package), like wrangler and vite.
# Desktop dev loads the SPA from the running Worker at localhost:8787/app, so
# the same relative /api/* calls work as on the web.

# tauri.conf.json already runs `mise run web:build` via
# beforeDevCommand/beforeBuildCommand, so web:build is deliberately NOT in
# depends here — listing it too rebuilt the SPA twice per invocation.
[tasks."tauri:dev"]
description = "Run the Tauri desktop app against the local Worker"
depends     = ["install", "dev:ensure"]
run         = "bun x tauri dev"

# tauri.conf.json already runs `mise run web:build` via
# beforeDevCommand/beforeBuildCommand, so web:build is deliberately NOT in
# depends here — listing it too rebuilt the SPA twice per invocation.
[tasks."tauri:build"]
description = "Build the signed-less Tauri desktop bundle (.app + .dmg)"
depends     = ["install"]
run         = "bun x tauri build"

[tasks."tauri:info"]
description = "Show Tauri environment diagnosis (toolchain, versions, config)"
depends     = ["install"]
run         = "bun x tauri info"

[tasks."tauri:ios:deps"]
description = "Install CocoaPods into the project GEM_HOME (idempotent)"
# RUBY_BIN must be prepended: mise places its own tool paths after /usr/bin, so
# without this `ruby` is macOS's 2.6 and cocoapods 1.17 will not run on it
# ("ffi requires Ruby version >= 3.0"). Gems land in .gem/, not in Homebrew.
run = """
export PATH="$RUBY_BIN:$PATH"
if pod --version >/dev/null 2>&1; then
  echo "tauri:ios:deps: cocoapods $(pod --version) already installed"
  exit 0
fi
echo "tauri:ios:deps: installing cocoapods $COCOAPODS_VERSION into $GEM_HOME"
gem install cocoapods -v "$COCOAPODS_VERSION" --no-document
"""

[tasks."tauri:ios:init"]
description = "Scaffold the iOS Xcode project (idempotent)"
depends     = ["install", "tauri:ios:deps"]
# Skips once the project exists and neither the Tauri config nor the crate
# manifest has changed, so tauri:ios:dev can depend on it unconditionally.
sources     = ["src-tauri/tauri.conf.json", "src-tauri/Cargo.toml"]
# CocoaPods comes from mise, on demand, rather than a global `brew install`.
# `tauri ios init` shells out to `pod`, so it must be on PATH for the child
# process — hence wrapping the whole command in `mise exec` rather than
# provisioning in a separate task. Per-task `tools = {}` would express this
# directly but is silently ignored on mise 2026.8.9.
run = """
export PATH="$RUBY_BIN:$PATH"
bun x tauri ios init
"""

# tauri.conf.json already runs `mise run web:build` via
# beforeDevCommand/beforeBuildCommand, so web:build is deliberately NOT in
# depends here — listing it too rebuilt the SPA twice per invocation.
[tasks."tauri:ios:dev"]
description = "Run the iOS app in the Simulator against the local Worker"
depends     = ["install", "dev:ensure", "tauri:ios:init"]
run = """
export PATH="$RUBY_BIN:$PATH"
bun x tauri ios dev
"""

# ── Tunnel ──────────────────────────────────────────────────────────────────
# Emulators reach localhost directly and need no tunnel. A tunnel is only
# required for Apple Universal Links: Apple's CDN fetches
# /.well-known/apple-app-site-association from the public internet, so it can
# never see localhost. A *named* tunnel is required — a random trycloudflare
# hostname is useless because Apple caches the file against the domain.

[tasks."tunnel:login"]
description = "Authenticate cloudflared with Cloudflare (one-off, opens browser)"
run         = "cloudflared tunnel login"

[tasks."tunnel:quick"]
description = "Expose local Worker on a random trycloudflare URL (real-device testing)"
# Fine for loading the app on a phone off your LAN. NOT usable for Universal
# Links — the hostname changes every run and Apple caches the AASA per domain.
run         = "cloudflared tunnel --url {{env.DEV_URL}}"

[tasks."tunnel:setup"]
description = "Create the dev tunnel and its fixed hostname via the Cloudflare API (one-off, idempotent)"
depends     = ["install"]
# Replaces `tunnel:named`, which could not run: it needed `cloudflared tunnel
# login` — a browser flow writing a cert.pem — and referenced two env vars that
# were never defined. scripts/tunnel-setup.ts explains why the API path needs
# no certificate.
run = "bun scripts/tunnel-setup.ts"
