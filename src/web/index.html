<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<!-- iOS reads these from the document, not the manifest: without the
       apple-touch-icon it puts a screenshot of the page on the home screen,
       which is what installing this used to produce. Generated from
       src/web/brand.svg by `mise run brand:icons`. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48"/>
  <link rel="icon" href="/brand.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png"/>
  <meta name="theme-color" content="#dd5230"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Remy Sport</title>
<link rel="stylesheet" href="./styles.css"/>
</head>
<body>
<div id="root"></div>

<script>
/*
  The MoQ relay, for the live-video test harness.
 
  Empty by default, and every video surface then renders a notice rather than
  failing — which is the majority path until a token is provisioned. The token
  goes in the URL *path* on Cloudflare's relay, and their own guidance is that
  path tokens appear in server access logs: issue short-lived ones per client
  and rotate them.
 
  Set here rather than through import.meta.env because this repo has no
  vite-env.d.ts and the SPA's tsconfig excludes the Worker's types, so
  import.meta.env does not typecheck in src/web.
*/
window.MOQ = {
  url: "https://draft-16.cloudflare.mediaoverquic.com",
  token: ""
};

window.TWEAK_DEFAULTS = {
  accentColor: "#D17246",
  spoilerMode: false,
  language: "EN",
  density: "comfortable"
};
</script>

<script type="module" src="./main.tsx"></script>
</body>
</html>
