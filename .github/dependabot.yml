# Dependency updates as pull requests against the gate, weekly.
#
# One grouped pull request rather than one per package: this repo's packages
# move together — Vite with its plugin, React with its types, wrangler with the
# Workers Vitest plugin — and forty separate branches would each run the gate
# to prove a third of an upgrade. What the group buys is the thing that makes
# this worth having at all: `bun run check` and `bun run test:e2e` run against
# the whole update at once, which is how it would land anyway.
#
# Two exceptions are pinned deliberately and belong in docs/plan-latest.md
# rather than here: vitest is held at 4 by @cloudflare/vitest-plugin's peer
# range (measured — 5 throws out of workerd), and the `sharp` override exists
# so miniflare and the icon generator share one native binary. A pull request
# that trips either will fail the gate and say so, which is the honest way for
# a bot to learn a constraint.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: deps

  # The workflow's own actions, which nothing else would ever notice ageing.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: deps
