# The gate, on every push and every pull request.
#
# It needs nothing from Cloudflare. The Worker runs in workerd, D1 is local,
# and sign-in codes come from the dev outbox — the whole of `bun run check` and
# `bun run test:e2e` is local by construction, which is what makes running them
# here worth anything: a red tick means the code is wrong, never that a secret
# is missing.
#
# mise installs the toolchain from mise.toml, so this job runs the versions the
# repo pins rather than whatever the runner ships. That is the point of pinning
# them.
name: check

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          # mise.toml is the source of truth for bun, node and the rest.
          install: true
          cache: true

      # Playwright's browsers, keyed by the version in the lockfile: a cache
      # hit skips a ~200MB download, and a miss is correct rather than stale.
      - uses: actions/cache@v6
        id: browsers
        with:
          path: .playwright
          key: webkit-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      # What `bun run setup` does, minus the parts only a laptop needs (the
      # tunnel's hostname, the MCP's own browser). The local database is
      # migrated because the worker tier and the e2e tier both read it.
      - run: bun scripts/lib/dev-vars.ts
      - run: bun x wrangler types
      - run: bun scripts/db.ts migrate-local
      - run: bun x playwright install webkit
        if: steps.browsers.outputs.cache-hit != 'true'

      - run: bun run check
      - run: bun run test:e2e

      # The report is worth having only when something failed.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
