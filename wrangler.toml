name = "remy-sport"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# `unhandled_rejection_after_microtask_checkpoint` is not cosmetic, and it is
# not only a test fix.
#
# Without it, workerd fires `unhandledrejection` before the microtask checkpoint
# completes — so a promise that rejects on one tick and is caught on the next is
# reported as unhandled even though nothing was ever unhandled. Better Auth
# wraps every endpoint in `AsyncLocalStorage.run()`, which is exactly such a
# multi-tick chain, so *every expected 4xx from sign-in* raised one: a wrong OTP,
# an inactive account, a disabled password login.
#
# The cost was ten spurious errors on every `mise run test:worker`. All 222 tests
# passed and the run still exited non-zero at random, which is worse than a
# consistent failure — it teaches you to re-run rather than to read the output,
# and it would have hidden a real unhandled rejection completely.
#
# Isolated to twelve lines: a plain rejected promise is reported correctly, and
# the same rejection through `AsyncLocalStorage.run` is not.
#
# The flag rather than a compatibility_date bump. The behaviour becomes the
# default on 2026-03-03, and bumping the date to reach it would enable every
# other change since 2025-09-01 at the same time — a much larger blast radius
# for one fix. It only makes rejection *reporting* accurate, so there is no
# behaviour here to lose.
#
# https://developers.cloudflare.com/workers/configuration/compatibility-flags/
compatibility_flags = ["nodejs_compat", "unhandled_rejection_after_microtask_checkpoint"]

# Custom domain. Required for Apple universal links — workers.dev cannot serve
# an Associated Domains file. Wrangler creates the DNS record on deploy.
# NOTE: this is a development host. Apple bakes the domain into the app
# entitlement, so moving to the real brand domain later requires an app update.
[[routes]]
pattern       = "remy.ubuntusoftware.net"
custom_domain = true

# Static assets — the Vite SPA (src/web) served from this same Worker, so the
# GUI and the API share one origin. No CORS, no cross-site cookies.
#
# Asset-first, which is wrangler's default. This was `run_worker_first = true`,
# justified by Worker routes named /login and /dashboard that ADR 020 deleted.
# What it still cost was every hashed bundle being a Worker invocation — billed
# at the standard request rate and writing an observability log — where a
# request the asset store answers is free and unlimited.
#
# Safe because no built path can shadow a Worker route: the whole asset surface
# is /index.html and /assets/*, while the Worker owns /, /api/*, /rpc/*,
# /openapi.json, /doc and /.well-known/*. **A new top-level file in dist/web
# that collides with one of those would silently win the route** — that is the
# thing to re-check if the build output ever grows one.
[assets]
directory = "./dist/web"
binding   = "ASSETS"
# Serve files at their literal path. The default ("auto-trailing-slash") 307s
# /index.html to /, and / is the Worker's — it serves the SPA shell. Together
# with html_handling, `not_found_handling = "none"` is what makes / match no
# asset and reach the Worker at all.
html_handling      = "none"
not_found_handling = "none"

# D1 Database
# Append-only product telemetry, read by aggregation. Not D1: a D1 row is a fact
# somebody can edit and a foreign key means something, and this is neither — it
# is unbounded, never updated, and only ever queried in aggregate.
# The reminder job. Hourly, because the PO's EVENT_REMINDER names a 24-hour and
# a one-hour window and an hour is the coarsest tick that can serve both.
#
# Not more often. Each firing is a scan of upcoming events, the windows are
# hours wide, and `notification_sent` makes a run idempotent — so a finer cron
# would buy nothing and cost a scan. Not less often, because a two-hour tick
# cannot deliver a one-hour warning at all.
[triggers]
# Every five minutes, not hourly.
#
# EVENT_REMINDER promises 24h and 1h. An hourly sweep gives the 1h window up to
# 59 minutes of error, so "starting soon" could arrive as the game tipped off —
# the notification arriving after the thing it warns about.
#
# The cost is 12x the invocations, each running the due-events scan. That scan
# is an index range lookup since migration 0014 (event_start_date_idx); it was
# a full table scan, which is what made this worth checking before changing.
crons = ["*/5 * * * *"]

# ── Notification fan-out ─────────────────────────────────────────────────────
#
# Delivery moved off the request path. `announce()` used to be awaited inside
# the score mutation and did one fetch per recipient, so a coach tapping "+2"
# waited on N HTTP round trips to Apple and Google — and N is bounded by the
# Workers per-request subrequest limit, which a well-followed game walks into
# with nothing in the code noticing.
#
# **At-least-once redelivery is safe here, and this is the property that makes
# it safe:** every push carries a `topic` header and a browser `tag`, and a
# repeated push with the same tag REPLACES the previous card rather than
# stacking. A duplicate is invisible to the reader. There is no idempotency
# ledger and none is needed. If anyone ever makes tags unique per send — a
# timestamp, a nonce — this design breaks silently and every retry becomes a
# second notification. See src/api/notify-queue.ts.
[[queues.producers]]
queue   = "remy-notifications"
binding = "NOTIFICATIONS"

[[queues.consumers]]
queue = "remy-notifications"
# One job per message: a job is already a whole fan-out, and batching them would
# put several audiences behind one subrequest budget — the thing being fixed.
max_batch_size    = 1
max_batch_timeout = 5
# Three attempts, then the dead letter queue. A poisoned message must stop being
# retried and start being visible.
max_retries       = 3
dead_letter_queue = "remy-notifications-dlq"

# The DLQ has a consumer of its own, and that is the whole point of it.
#
# A message sitting unread in a dead letter queue is "notifications silently
# stopped" — the exact failure class this session has been about. So the
# consumer does not retry anything: it records `notify.dead` telemetry, beside
# push.batch, so a failure shows up in the same place somebody already looks.
[[queues.consumers]]
queue          = "remy-notifications-dlq"
max_batch_size = 10
max_retries    = 0

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "remy_sport_events"

[[d1_databases]]
binding = "DB"
database_name = "remy-sport-db"
database_id = "c5b3cb3e-6b40-45e3-8e9a-ec7cddb84a87"
migrations_dir = "src/db/migrations"

# R2 Storage
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "remy-sport-storage"

[observability]
enabled            = true
head_sampling_rate = 1

# Cloudflare Email Service — outbound transactional mail (org invitations).
#
# No restriction attribute, so the binding may send to any verified destination
# address in the account, and to any recipient at all once the sending domain is
# onboarded to Email Service. Invitations go to people who are not in the
# account yet, so that onboarding plus the Workers **Paid** plan are both
# prerequisites — outbound sending is not available on the Free plan. See
# ADR 010.
[[send_email]]
name = "EMAIL"

[vars]
BETTER_AUTH_URL = "https://remy.ubuntusoftware.net"
# Production sends for real. Local dev and tests override this to "outbox" via
# .dev.vars (written by `mise run dev:vars`), which takes precedence over
# [vars] — so nothing here can cause a test run to attempt delivery.
MAIL_TRANSPORT  = "cloudflare"
# Which capability table applies — see src/environment.ts. Absent or
# unrecognised resolves to production, so this line is a courtesy rather than
# load-bearing: the strict answer is the default.
ENVIRONMENT     = "production"
EMAIL_FROM      = "noreply@remy.ubuntusoftware.net"

# TEST_OTP is deliberately NOT here, and production is the only environment
# where it is read at all.
#
# `signInCode` in src/environment.ts says where the fixed code comes from: dev
# and staging derive it from the table, because every seeded address there is
# `.test` and reaches nobody, so there is nothing to provision and nothing to
# forget. Production is `"secret"` — the one place a human decides.
#
# It fixes the sign-in code for the twelve seeded people so the deployed
# Playwright suite can authenticate — their addresses are `.test`, nothing
# delivers to them, and the dev outbox does not exist on a deployment and must
# not. It does NOT make the account picker appear here: `seededSignIn` is false
# for production and that is a separate row on purpose.
#
# It lives as a Worker secret instead, set by `mise run demo:on` and removed by
# `mise run demo:off`. Not because the value is secret — it is published to the
# browser with the account list and the page says so — but because a secret can
# be changed without a redeploy. A switch you may need off in a hurry should not
# require a commit, a build and a deploy to flip.
#
# What keeps it safe is scope, and `cf:smoke` asserts every part:
#   * it applies only to addresses the fixtures seed — a real address always
#     gets a random code (src/auth.ts)
#   * the seeded ADMIN is excluded on any deployment, because that account can
#     impersonate and so reach a real person
#   * /api/dev/outbox stays 404, so nobody else's code is ever readable
#
# `mise run demo:off` before the platform has real users. A demo account cannot
# reach anyone else's data, but it can edit shared fixture data — and once real
# events exist, those are not fixtures any more.

# BETTER_AUTH_SECRET is set via `wrangler secret` — not stored in config
# For local dev, .dev.vars provides the secret

# `import seedSql from "./seed.sql"` — the seed is data, and the Worker executes
# the same bytes the tests do rather than reimplementing the inserts.
# fallthrough keeps wrangler's own default rules (wasm, text, binary) active.
[[rules]]
type        = "Text"
globs       = ["**/*.sql"]
fallthrough = true

# ── Staging ──────────────────────────────────────────────────────────────────
#
# A deployment that is not production. `ENVIRONMENT = "staging"` below selects
# the middle column of the policy table in src/environment.ts: real mail, the
# seed route, seeded sign-in, no admin in the picker, no dev mail routes.
#
# ## Read this before adding anything above
#
# Named environments inherit SOME top-level keys and not others, and the two
# failure modes are not equally survivable. This was verified with
# `wrangler deploy --dry-run --env staging` against this file, not from the
# documentation — Cloudflare's inheritable-keys list omits send_email,
# d1_databases and analytics_engine_datasets from the non-inheritable column
# while wrangler warns about all three. **Trust the dry run.**
#
# NOT inherited — and these are the safe ones. Wrangler names each missing key
# as a warning and the binding is simply absent, so the failure is loud and
# local to staging. A minimal [env.staging] resolves to exactly one binding,
# ASSETS. Everything else here is a redeclaration for that reason.
#
# INHERITED — and these are the dangerous ones, because inheriting is legal and
# therefore silent:
#
#   * `routes` — an [env.staging] with no route override inherits
#     `remy.ubuntusoftware.net` and wrangler says nothing. That is not a
#     misconfigured staging environment, it is a staging build deployed onto
#     production's hostname. The override below is the whole mitigation, and
#     `scripts/check-envs.ts` asserts against the resolved config that staging's
#     route is staging-remy and never remy.
#
#   * `triggers` — staging inherits crons = ["*/5 * * * *"]. Kept deliberately:
#     the reminder sweep running against fixtures is a thing worth exercising
#     before it runs against real events, and it notifies seeded `.test`
#     addresses that reach nobody. **When the daily digest cron is added this
#     stops being free** — staging would send an ops digest to real people every
#     day alongside production's. The digest job must check ENVIRONMENT rather
#     than assume one deployment.
[env.staging]
name = "remy-sport-staging"

# Overriding, not adding. See the `routes` note above — without this block
# staging deploys onto production's hostname with no warning.
#
# custom_domain = true for the same reason production uses it: wrangler creates
# the DNS record on deploy, so there is no dashboard step and no hand-made
# record to drift.
[[env.staging.routes]]
pattern       = "staging-remy.ubuntusoftware.net"
custom_domain = true

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
# Its own dataset. Staging traffic in production's would corrupt the numbers the
# policy table exists to keep separate — and staging samples at 1, so it would
# contribute rows out of all proportion to its traffic.
dataset = "remy_sport_events_staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "remy-sport-staging-db"
# PLACEHOLDER. The database does not exist yet — creating it is an account
# change and needs sign-off. `mise run cf:env:bootstrap` writes the real id here
# when it creates it; until then a staging deploy fails at the API with "no such
# database", which is the correct loud failure.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "src/db/migrations"

[[env.staging.r2_buckets]]
binding = "STORAGE"
bucket_name = "remy-sport-staging-storage"

# Suffixed, where production's are bare. A shared queue would be worse than a
# shared database: a staging producer's message is consumed by whichever worker
# is subscribed, so staging fixtures would fan out through production's sender
# to production's real subscribers.
[[env.staging.queues.producers]]
queue   = "remy-notifications-staging"
binding = "NOTIFICATIONS"

[[env.staging.queues.consumers]]
queue = "remy-notifications-staging"
max_batch_size    = 1
max_batch_timeout = 5
max_retries       = 3
dead_letter_queue = "remy-notifications-staging-dlq"

[[env.staging.queues.consumers]]
queue          = "remy-notifications-staging-dlq"
max_batch_size = 10
max_retries    = 0

[[env.staging.send_email]]
name = "EMAIL"

[env.staging.vars]
BETTER_AUTH_URL = "https://staging-remy.ubuntusoftware.net"
# Staging sends real mail — that is the point of it, and the row the policy
# table exists to express. `capturesMail: false`.
MAIL_TRANSPORT  = "cloudflare"
ENVIRONMENT     = "staging"
# Staging's own sending identity, for the reason docs/dev/email-deliverability.md
# gives for splitting bulk from transactional: reputation attaches per domain,
# and a staging test that trips a spam filter must not be able to take
# production's sign-in mail down with it.
#
# **This subdomain is not onboarded to Email Service yet.** Until it is, staging
# mail is rejected at send. That is deliberate — the alternative default, having
# staging send as noreply@remy.ubuntusoftware.net, would work immediately and be
# the exact coupling the split exists to prevent.
EMAIL_FROM        = "noreply@staging.remy.ubuntusoftware.net"
NOTIFY_EMAIL_FROM = "notifications@staging.remy.ubuntusoftware.net"

# TEST_OTP is not here either, and on staging it is not a secret you set.
# `seededSignIn` decides whether the demo picker appears; the fixed code decides
# whether those accounts can get in. Two halves of one capability, so staging
# derives both from the policy table and production stays the only environment
# where a human sets the value.
